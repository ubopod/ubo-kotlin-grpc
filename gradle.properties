org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# The generated Ubo.java for the ubo.v1 package is ~20 MB / 544K LOC with
# 1100+ nested classes; the Kotlin compiler daemon needs heap headroom to
# index it during cross-package symbol resolution.
kotlin.daemon.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=4g
kotlin.compiler.execution.strategy=in-process
